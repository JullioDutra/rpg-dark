        - {id: A2-WAT-5, titulo: "A Maré do Retorno", tipo: obrigatorio, escopo: party, requer: [A2-WAT-4], viloes_permitidos: [V068, V084], objetivo: "Desmascarar e derrotar Saigō; derrotar Otohime Negra", condicao_conclusao: "Saigō derrotado (morto ou capturado)", batalha_mortal: true}
        - {id: A2-WAT-6, titulo: "O Coração do Rei", tipo: obrigatorio, escopo: party, requer: [A2-WAT-5], objetivo: "Destino do Núcleo Abissal", condicao_conclusao: "Núcleo em estado definido", recompensas: {xp: 6000, merito: 40}}

