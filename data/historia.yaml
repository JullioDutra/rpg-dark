# Roteiro estruturado de "O Eclipse do Ovo Eterno" — lido pelo Diretor de História (doc 11).
# Lore completa em docs/14-historia-principal.md; arcos em docs/15; vilão em docs/16.
# Validar com: python3 scripts/validar-historia.py
#
# Campos de marco:
#   tipo: obrigatorio | opcional | secreto | crise (crise = tem prazo em tempo real)
#   escopo: mundo (vale para o grupo todo) | jogador (cada jogador cumpre o seu) | party
#   requer: marcos que precisam estar concluídos (lista = todos; {qualquer: [...]} = pelo menos um)
#   cena: orientação para a IA gerar a cena com detalhes (cenário, clima, NPCs, sensações)
#   verdade: camada de verdade liberada ao concluir (doc 14.7)
#   falha: o que acontece se a crise vencer o prazo ou o grupo for derrotado
#   relogio: variação do Relógio do Eclipse ao concluir (negativo) ou falhar (positivo)

historia:
  titulo: "O Eclipse do Ovo Eterno"
  objetivo_dos_jogadores: "Tornar-se forte o bastante para derrotar o Eclipse e ser coroado Seiō (星王), o Rei-Estrela"
  tom: "Shōnen sombrio: épico, trágico, com humor nos momentos de respiro. Perdas reais. Esperança conquistada."
  dificuldade: dificil

  proibicoes:
    - "Nunca revelar quem é o portador do Ovo Eterno no grupo; só o motor sabe (segredos_mundo)."
    - "Nunca revelar uma camada de verdade antes do marco que a libera; pistas indiretas são permitidas."
    - "Kanata nunca quebra o texto literal de um contrato assinado."
    - "Kanata não ataca pessoalmente antes de A2-M3 (ele age por servos)."
    - "Nenhum rei atual morre fora do arco do seu reino ou de A3-M6."
    - "Nisteroy não fala com ninguém antes de A3-M9."
    - "O Esquife só pode ser aberto no Ato IV ou pelo Relógio do Eclipse em 100%."
    - "Kaien nunca aparece fisicamente antes de A4-M7 — apenas em sonhos e ecos."
    - "A IA nunca decide uma traição por um jogador; traição exige !trair do próprio jogador."

  finais:
    estelar:
      condicao: "4 núcleos com jogadores (confiados ou recuperados) + Ovo claro + 3 dos 4 Grandes Itens no grupo final + vitória em A4-M7"
      epilogo: "O ovo choca. Hoshiryū nasce. Nisteroy reconhece o filho e a fusão se rompe. Kaien, sozinho, encara quem tem o Diário de Sayo — redenção ou fim. O buraco se fecha e uma muda de Árvore-Estrela brota no Vale de Hinata. O Seiō é coroado."
    selo:
      condicao: "Vitória em A4-M7 sem o Ovo claro"
      epilogo: "O Eclipse cai, mas não se separa. Alguém precisa virar o novo selo: um rei vivo ou um jogador voluntário (Morte Verdadeira). O Seiō é coroado sobre um mundo de luto."
    eclipse:
      condicao: "Relógio do Eclipse em 100% fora do Ato IV, ou derrota total do grupo em A4-M7"
      epilogo: "O Esquife se abre. Kanata é o primeiro a ser devorado. O buraco engole o céu. Narração do fim do mundo para cada personagem, citando seus feitos."

  atos:
    # ═══════════════════════════════════════════════════════════════════════
    - id: A1
      titulo: "As Cinzas Despertam"
      nivel_sugerido: "1–20"
      resumo: "Cada jogador vive o primeiro sinal do mal na sua aldeia. Todos convergem para o Festival dos Quinhentos Anos, onde o selo racha. Os reis convocam heróis."
      marcos:
        - id: A1-M1
          titulo: "Despertar"
          tipo: obrigatorio
          escopo: jogador
          requer: []
          gatilho: "Ao concluir a Cerimônia do Sorteio"
          objetivo: "Apresentar a aldeia, a família/mentor e o gancho de aldeia (doc 15.0)"
          cena: "Abrir com os sentidos: cheiro, clima, som da aldeia. Mostrar a casta na vida cotidiana. Terminar com o gancho de aldeia como cliffhanger."
          condicao_conclusao: "Jogador interage com o gancho de aldeia (ação livre ou !explorar)"
          fatos_disponiveis: [F01, F02]
          viloes_permitidos: [V001, V002, V009, V010, V013, V017, V018, V025, V026]
          se_atrasar: "Após 2 dias reais, o gancho vem até o jogador (o problema bate na porta)."

        - id: A1-M2
          titulo: "O Primeiro Sinal"
          tipo: obrigatorio
          escopo: jogador
          requer: [A1-M1]
          gatilho: "Jogador chega ao nível 3 ou conclui a primeira subfase"
          objetivo: "Encontrar a primeira criatura do vazio ou o Culto da Cinza na sua região"
          cena: "Algo sem cor num lugar familiar. Silêncio antinatural. Os animais fogem antes (telegrafia). Um NPC conhecido é ferido ou desaparece."
          condicao_conclusao: "Vencer ou escapar do encontro"
          fatos_disponiveis: [F03, F04]
          viloes_permitidos: [V033, V006, V037]
          falha: "Derrota: o NPC querido do jogador é levado (vira refém resgatável no Ato II)."

        - id: A1-M3
          titulo: "O Selo da Guilda"
          tipo: obrigatorio
          escopo: jogador
          requer: [A1-M2]
          gatilho: "Qualquer posto da Guilda de Kyōkai (existe um em cada capital)"
          objetivo: "Registrar-se na Guilda e aceitar a primeira missão paga — OU recusar (o jogador fica sem missões da Guilda, mas imune a Mil Contratos)"
          cena: "Salão de madeira escura, contratos pregados nas paredes, um atendente sorridente demais. Yoru aparece só como um nome numa assinatura de tinta prateada."
          condicao_conclusao: "Aceitar missão (registra contrato_guilda=true) ou recusar formalmente"
          fatos_disponiveis: [F05]
          viloes_permitidos: [V034]
          nota_motor: "Cada missão da Guilda gera uma 'funcao_oculta' secreta que conta pontos para o plano de Kanata (doc 16.1)."

        - id: A1-M4
          titulo: "A Lenda Contada Errado"
          tipo: opcional
          escopo: jogador
          requer: [A1-M2]
          gatilho: "Conversar com anciões, bibliotecários, bardos ou cultistas"
          objetivo: "Ouvir o mito oficial e perceber contradições (pistas da Camada 2)"
          cena: "Cada reino conta a lenda diferente. Um velho bêbado jura que o demônio 'chorava'."
          condicao_conclusao: "Reunir 2 versões diferentes da lenda"
          recompensas: {xp: 200, merito: 5}

        - id: A1-M5
          titulo: "O Festival dos Quinhentos Anos"
          tipo: crise
          escopo: mundo
          requer: {qualquer_n: 2, de: [A1-M3]}
          gatilho: "Quando metade dos jogadores ativos concluiu A1-M3, o festival é anunciado para dali a 3 dias reais"
          prazo_horas_reais: 72
          objetivo: "Todos os jogadores podem viajar para Kyōkai. Na cerimônia, um pilar da Muralha racha e rastejantes atacam a multidão"
          cena: "Lanternas dos quatro elementos, os quatro reis num palanque, comida de todos os reinos, crianças com máscaras de dragão. No auge, o som some. A lua escurece. Uma voz em todas as cabeças: 'Quinhentos anos. Devolvam o que roubaram.' Pânico. Rastejantes sem cor saem do chão."
          condicao_conclusao: "Defender a multidão até os reis selarem a rachadura (3 ondas de combate)"
          fatos_disponiveis: [F06, F07, F08]
          viloes_permitidos: [V033, V035, V080]
          falha: "Se nenhum jogador comparecer ou o grupo cair: 200 civis morrem, o rei Sorahiko é ferido (começa o arco de Fūjin em desvantagem)."
          relogio: {sucesso: -3, falha: 8}
          recompensas: {xp: 1500, merito: 20}

        - id: A1-M6
          titulo: "O Nome do Demônio"
          tipo: obrigatorio
          escopo: mundo
          requer: [A1-M5]
          gatilho: "Logo após o Festival"
          objetivo: "A guardiã Kanae, ferida, conta aos jogadores o que os guardiões dos selos sabem"
          cena: "Kanae, meio pedra, meio carne, sangrando areia. Ela fala de um menino chamado Kaien e de um dragão — 'os dois choravam'."
          verdade: 2
          condicao_conclusao: "Ouvir Kanae (qualquer jogador presente)"
          fatos_disponiveis: [F09]

        - id: A1-M7
          titulo: "Os Reis Convocam"
          tipo: obrigatorio
          escopo: mundo
          requer: [A1-M6]
          gatilho: "1 dia real após A1-M6"
          objetivo: "Cada rei pede ajuda; abrem-se os 4 arcos do Ato II"
          cena: "Quatro mensageiros, quatro selos de cera, quatro pedidos com tons diferentes: Ryūen ordena, Kaishin pede com cortesia gelada, Gōtetsu escreve à mão com erros, Sorahiko manda um desenho engraçado com uma frase séria no verso."
          condicao_conclusao: "Automático"
          recompensas: {xp: 500}

        - id: A1-M8
          titulo: "A Pedra Morna"
          tipo: secreto
          escopo: mundo
          requer: [A1-M7]
          gatilho: "Imediatamente após A1-M7"
          objetivo: "O motor escolhe o portador do Ovo Eterno (doc 14.6) e coloca a 'Pedra Ovalada Morna' no inventário dele, sem aviso"
          cena: "Nenhuma no grupo. Para o portador, no privado, só uma linha casual dentro da próxima narração: 'Entre suas coisas há uma pedra cinza e lisa que você não lembra de ter pegado. Está morna.'"
          condicao_conclusao: "Automático"

    # ═══════════════════════════════════════════════════════════════════════
    - id: A2
      titulo: "A Guerra dos Núcleos"
      nivel_sugerido: "20–50"
      resumo: "Quatro arcos de reino em paralelo (doc 15). Kanata começa a sussurrar. Zero caça. Yoru é desmascarado."
      marcos:
