        - {id: A2-FUJ-2, titulo: "O Rei que Ri", tipo: obrigatorio, escopo: party, requer: [A2-FUJ-1], objetivo: "Ganhar a confiança de Sorahiko na corrida dos telhados", condicao_conclusao: "Teste de VEL ou ação criativa nota ≥ 6 no Juiz de Táticas"}
