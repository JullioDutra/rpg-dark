        - id: A2-M3
          titulo: "O Rosto de Yoru"
          tipo: obrigatorio
          escopo: mundo
          requer: {qualquer_n: 2, de: [A2-HOM-6, A2-WAT-6, A2-DAI-6, A2-FUJ-6]}
          gatilho: "2 arcos concluídos — ou antes, se os jogadores juntarem 3 pistas (contrato da Guilda de Kōsaku, confissão de Saigō, mãos queimadas)"
          objetivo: "Yoru se revela como Kanata, descendente de Sayo, e conta ao mundo inteiro a culpa dos reis antigos (versão distorcida)"
          cena: "Todas as lanternas da Guilda se apagam ao mesmo tempo em todas as capitais. A voz de Yoru, calma, em todas as praças. Ele tira o capuz pela primeira vez — à luz do dia."
