    festival_civis_salvos: "Os sobreviventes do Festival ergueram uma lanterna para cada herói."
    duelo_verdade: "Ryūen e Hyōsuke governam Homura juntos, alternando as estações."
    verdade_publica: "Os reinos aprenderam a pedir perdão. Uma estátua de Kaien foi erguida — de costas, olhando para casa."
    kaishin_morto_em_paz: "Watatsumi elegeu seu primeiro rei pelo voto."
    guardias_salvas: "Kanae e Shizuku guardam a Muralha, agora sem rachaduras."
    zero_aliado: "Zero abriu uma escola para anti-magos em Kyōkai."
    toya_livre: "Tōya envelheceu em uma semana e morreu sorrindo, cercado pela família de Sayo."
    kanata_redimido: "O nome de Kanata está gravado no Esquife vazio, abaixo dos quatro reis."
    kaien_redimido: "Às vezes, no Vale de Hinata, alguém ouve uma cantiga de fazer pão."
