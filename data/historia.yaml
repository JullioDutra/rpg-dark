          titulo: "Os Primeiros Sussurros"
          tipo: obrigatorio
          escopo: jogador
          requer: [A1-M7]
          gatilho: "Jogador conclui o 2º capítulo de qualquer arco de reino"
          objetivo: "Kanata (como 'uma voz amiga') manda o primeiro sussurro privado, com uma oferta pequena"
          cena: "Mensagem privada, curta, educada, que demonstra saber algo pessoal do jogador."
          condicao_conclusao: "Jogador responde, ignora por 24h ou revela ao grupo"

        - id: A2-M2
          titulo: "O Caçador"
          tipo: opcional
          escopo: party
          requer: [A1-M7]
          gatilho: "Qualquer jogador chega ao nível 30"
          objetivo: "Zero embosca o jogador mais forte"
          cena: "Correntes negras no escuro. Magias simplesmente apagam. Zero não fala, só conta os golpes."
          viloes_permitidos: [V080]
          condicao_conclusao: "Sobreviver; vencer sem magia faz Zero hesitar (pré-requisito para virar aliado)"
          falha: "Derrota → captura (doc 19.3)."

        # ─── Arco de Homura (doc 15.1) ───
