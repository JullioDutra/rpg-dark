          condicao_conclusao: "Automático"
          fatos_disponiveis: [F14, F15]
          nota_motor: "A partir daqui, Kanata pode lutar pessoalmente. Sussurros passam a ser assinados."

        - id: A2-M4
          titulo: "Os Pilares Rachados"
          tipo: obrigatorio
          escopo: mundo
          requer: [A2-M3, A2-HOM-6, A2-WAT-6, A2-DAI-6, A2-FUJ-6]
          subfases: [SF-KOK-02]
          viloes_permitidos: [V077, V078, V033]
