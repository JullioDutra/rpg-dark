          condicao_conclusao: "Vencer SF-KOK-02 (restaurar o selo = Final do Ato II heroico)"
          relogio: {sucesso: -5, falha: 10}
          recompensas: {xp: 10000, merito: 50}

    # ═══════════════════════════════════════════════════════════════════════
    - id: A3
      titulo: "O Ovo e o Portador"
      nivel_sugerido: "50–75"
      resumo: "Kanata põe preço no ovo e joga os jogadores uns contra os outros. O passado é visitado no Vale de Hinata. As relíquias são reunidas. A verdade final aparece."
