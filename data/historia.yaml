        - id: A3-M1
          titulo: "A Recompensa do Ovo"
          tipo: obrigatorio
          escopo: mundo
          requer: [A2-M4]
          objetivo: "Kanata anuncia: um dos jogadores carrega o Ovo Eterno. Recompensa: 1 Amuleto da Perdição + 50.000 ryō"
          cena: "Cartazes em todas as capitais com o desenho de uma pedra cinza. Mercenários olhando para os jogadores nas ruas."
          condicao_conclusao: "Automático"
          desbloqueia_regioes: [R-KOK-7, R-KOK-8]
          fatos_disponiveis: [F16, F17]

        - id: A3-M2
          titulo: "O Poço Seco"
          tipo: obrigatorio
          escopo: jogador
