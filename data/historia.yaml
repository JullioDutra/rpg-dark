        - {id: A2-HOM-4, titulo: "A Guerra Fabricada", tipo: crise, escopo: mundo, requer: [A2-HOM-2], prazo_horas_reais: 72, viloes_permitidos: [V063, V003], objetivo: "Provar que o ataque à Costa Akashio foi falsa bandeira de Saigō", condicao_conclusao: "Capturar um agente vivo e levá-lo a Ryūen ou Kaishin", falha: "Guerra Fogo×Água por 14 dias reais: rotas Homura↔Watatsumi fechadas, encontros de soldados em ambas as fronteiras.", fatos_disponiveis: [F11]}
        - {id: A2-HOM-5, titulo: "O Duelo pelo Trono", tipo: obrigatorio, escopo: party, requer: [A2-HOM-3], viloes_permitidos: [V061], objetivo: "Decidir o duelo entre Ryūen e Hyōsuke", condicao_conclusao: "Duelo resolvido", batalha_mortal: true, cena: "Arena em silêncio, o povo dividido, Hyōsuke usa uma técnica que pertence a um dos jogadores."}
